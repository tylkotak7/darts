<style>
:root,body[data-t="dark"]{--bg:#0e1115;--card:#181d24;--card2:#212832;--line:#2c3540;--txt:#eef1f4;--mut:#8b96a3;--red:#e63946;--grn:#2a9d8f;--gold:#f4b942;--s:#3a4452;--sp:#2a3038}
body[data-t="classic"]{--bg:#0a0a0a;--card:#171717;--card2:#262626;--line:#3a3a3a;--txt:#f4efe0;--mut:#a39d8c;--red:#d41f2d;--grn:#0e7c3a;--gold:#f4efe0;--s:#2e2e2e;--sp:#1f1f1f}
body[data-t="blue"]{--bg:#12141a;--card:#1c202b;--card2:#2a2f3d;--line:#323849;--txt:#eeeeee;--mut:#8e96ab;--red:#e0344b;--grn:#2f6df6;--gold:#6ea0ff;--s:#343b4d;--sp:#262b38}
body[data-t="light"]{--bg:#eef0f3;--card:#ffffff;--card2:#e1e5ea;--line:#cfd5dc;--txt:#111111;--mut:#5f6b78;--red:#d41f2d;--grn:#0e7c3a;--gold:#c77d00;--s:#5b6878;--sp:#46505c}
body[data-t="neon"]{--bg:#07060f;--card:#120f24;--card2:#1d1840;--line:#3a2f7a;--txt:#e8e8ff;--mut:#9a95c9;--red:#ff2d95;--grn:#8a2be2;--gold:#00e5ff;--s:#2a1e55;--sp:#1d1840}
body[data-t="pub"]{--bg:#1e140d;--card:#3a2616;--card2:#4a3220;--line:#6b4423;--txt:#f3e3c3;--mut:#b89a75;--red:#a3261f;--grn:#2e7d4f;--gold:#e0a526;--s:#5a3b22;--sp:#4a3220}
body[data-t="sukno"]{--bg:#0c2a1a;--card:#14442a;--card2:#1c5636;--line:#2e7d4f;--txt:#e9f5ec;--mut:#a6cdb2;--red:#d41f2d;--grn:#2e9e5b;--gold:#f5d63d;--s:#1f5a3a;--sp:#173f29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:0 12px calc(28px + env(safe-area-inset-bottom))}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
body.hasnav #app{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.appbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;margin:0 -12px 8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.appbar h1{flex:1;font-size:26px}
.ib{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;line-height:1}
.ib[data-act=home],.ib[data-act=back],.ib[data-act=optsback]{font-size:30px;padding-bottom:4px}
.screen.anim{animation:fin .22s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1.3px;margin:18px 4px 8px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tile .tt{font-family:Oswald;font-size:30px;line-height:1}
.tile .ts{font-size:12px;color:var(--mut)}
.tile.on{border-color:var(--gold);background:var(--card2)}
.tile.on .tt{color:var(--gold)}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:20px;padding:18px 16px;margin-top:10px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.big .bi{font-size:34px}
.big>div{flex:1}
.big b{font-family:Oswald;font-size:23px;letter-spacing:.5px;display:block}
.big span{font-size:13px;opacity:.9}
.big .arr{font-size:30px;opacity:.7}
.big.on1{background:linear-gradient(135deg,var(--red),#9c1f2a)}
.big.on2{background:linear-gradient(135deg,var(--grn),#1b5f57)}
.resume{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:14px 16px;margin:4px 0 4px}
.resume b{display:block;font-size:16px}.resume span{font-size:12px;color:var(--mut)}
.summary{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.link{background:none;color:var(--gold);font-weight:700;padding:0 4px;text-decoration:underline}
.cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:4;margin-top:12px}
.cta .btn{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:140px;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:14px}
.nav button .i{font-size:22px;filter:grayscale(.7);opacity:.8}
.nav button.on{color:var(--txt);background:var(--card2)}
.nav button.on .i{filter:none;opacity:1}
h1,h2,h3{font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.5px;margin:0}
h1{font-size:30px}h2{font-size:20px;margin:18px 0 10px}
.mut{color:var(--mut)}
button{font-family:inherit;color:var(--txt);border:0;cursor:pointer;touch-action:manipulation}
.btn{background:var(--card2);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--red);color:#fff;font-size:18px;padding:16px;width:100%;font-family:Oswald;letter-spacing:1px}
.btn.alt{background:var(--grn);color:#fff}
.btn.full{width:100%;margin-top:10px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:active,.k:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.chip.on{background:var(--gold);color:#111}
label.lbl{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
input.nick,input.txt,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px 14px;font-size:16px;font-family:inherit}
input.nick{margin-bottom:8px}
textarea{font-size:13px;min-height:110px;font-family:monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer}
.sw{width:48px;height:28px;border-radius:999px;background:#666;position:relative;transition:.2s;flex:0 0 48px}
.sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--grn)}.sw.on::after{left:23px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.top .tag{font-family:Oswald;color:var(--gold);font-size:18px}
.info{font-size:12px;color:var(--mut);margin:-4px 0 8px}
.players{display:grid;gap:8px;margin-bottom:10px}
.players.n1{grid-template-columns:1fr}.players.n2,.players.n3,.players.n4{grid-template-columns:1fr 1fr}
.pl{background:var(--card);border-radius:14px;padding:10px 12px;border:2px solid transparent;position:relative;overflow:hidden}
.pl.cur{border-color:var(--gold);background:var(--card2)}
.pl .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-family:Oswald;font-size:40px;line-height:1.05}
.pl.cur .sc{color:var(--gold)}
.pl .meta{font-size:11px;color:var(--mut)}
.pl .wins{position:absolute;top:8px;right:10px;font-size:11px;color:var(--gold)}
.turnbar{background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center}
.slot{background:var(--card2);border-radius:10px;height:46px;display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:22px;color:var(--mut)}
.slot.f{color:#fff;background:var(--s)}
.tsum{font-family:Oswald;font-size:26px;min-width:56px;text-align:center}
.hint{font-size:13px;color:var(--mut);margin-top:8px;min-height:18px}
.hint b{color:var(--grn)}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.mod{padding:13px 0;border-radius:12px;background:var(--card2);font-family:Oswald;font-size:18px;letter-spacing:1px;opacity:.6}
.mod.on{opacity:1;color:#fff}
.mod.m1.on{background:var(--s)}.mod.m2.on{background:var(--grn)}.mod.m3.on{background:var(--red)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.k{height:56px;border-radius:12px;background:var(--s);color:#fff;font-family:Oswald;font-size:22px}
.pad.m2 .k.n{background:var(--grn)}.pad.m3 .k.n{background:var(--red)}
.k.sp{font-size:16px;background:var(--sp)}
.k.bull{background:#9b2430}.k.b25{background:#1d6b3a}
.k.miss{background:#4a4a4a}.k.undo{background:#6b5530}
.k:disabled{opacity:.25}
.locked{opacity:.35;pointer-events:none}
.flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:Oswald;font-size:56px;color:var(--red);text-shadow:0 4px 24px #000;pointer-events:none;opacity:0;transition:opacity .2s;z-index:20;white-space:nowrap}
.flash.show{opacity:1}
.said{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--gold);color:#111;font-weight:700;font-size:18px;padding:12px 20px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;z-index:25;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.said.show{opacity:1}
.lastturn{background:var(--card);border-left:4px solid var(--gold);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.last{font-size:12px;color:var(--mut);text-align:center;margin:8px 0 0}
.voice{background:var(--card);border-radius:14px;padding:10px;margin-top:10px}
.mic{width:100%;font-size:18px;padding:14px;border-radius:12px;background:var(--sp);color:#fff;font-weight:700}
.mic.on{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.75}}
.heard{font-size:13px;color:var(--mut);margin-top:8px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:380px;text-align:center;max-height:90vh;overflow:auto}
.modal .box .btn{width:100%;margin-top:10px}
.trophy{font-size:54px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto}
svg.board{width:100%;height:auto;display:block}
.bars .b{display:grid;grid-template-columns:52px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bars .lab{font-family:Oswald;font-size:16px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.kpi .v{font-family:Oswald;font-size:24px}
.kpi .l{font-size:11px;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;background:transparent;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--gold);color:#111}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.target{text-align:center;margin:4px 0 10px}
.target .big{font-family:Oswald;font-size:64px;line-height:1;color:var(--gold)}
.shpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shpad .k{height:72px;font-size:28px}
.shpad .k.d{background:var(--grn)}.shpad .k.t{background:var(--red)}
.seginfo{font-size:13px;margin-top:8px;min-height:18px}
.leg2{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:8px}
.code{font-family:Oswald;font-size:48px;letter-spacing:8px;color:var(--gold);text-align:center}
.steps{font-size:14px;line-height:1.55;padding-left:20px;margin:8px 0}
.steps li{margin-bottom:6px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:18px}
/* ekran gry – wszystko na jednym ekranie, bez przewijania */
body.ingame #app{padding-bottom:0}
.gs{display:flex;flex-direction:column;height:100vh;height:100dvh;gap:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.gs>*{flex:0 0 auto}
.gs .appbar{margin:0 -12px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:4px}
.gs .ib{width:38px;height:38px;flex-basis:38px;font-size:17px}
.gs .tag{font-size:16px}
.gs .info{margin:0;font-size:11px}
.gs .players{margin:0;gap:6px}
.gs .pl{padding:5px 10px 6px;border-radius:12px}
.gs .pl .nm{font-size:13px}
.gs .pl .sc{font-size:30px;line-height:1.05}
.gs .pl .meta{font-size:10px}
.gs .pl .wins{top:5px;font-size:10px}
.gs .turnbar{margin:0;padding:6px 8px}
.gs .slots{gap:6px}
.gs .slot{height:36px;font-size:19px;border-radius:9px}
.gs .tsum{font-size:24px;min-width:48px}
.gs .hint{margin-top:4px;font-size:12px;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs .lt{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kp{flex:1 1 auto;min-height:190px;display:flex;flex-direction:column;gap:6px}
.kp .mods{margin:0;gap:6px;flex:0 0 auto}
.kp .mod{padding:8px 0;font-size:16px}
.kp .pad{flex:1;grid-template-rows:repeat(5,1fr);gap:6px}
.kp .k{height:auto;min-height:36px;font-size:21px}
.kp .k.sp{font-size:14px}
.kp .shpad{flex:1;grid-template-rows:2fr 1fr;gap:6px}
.kp .shpad .k{height:auto;font-size:28px}
.kp .shpad .k.sp{font-size:15px}
.tgt{display:flex;align-items:baseline;justify-content:center;gap:10px}
.tgt .tb{font-family:Oswald;font-size:38px;color:var(--gold);line-height:1}
.vrow{display:flex;gap:6px;align-items:center}
.micb{width:54px;height:46px;flex:0 0 54px;border-radius:12px;background:var(--sp);font-size:22px;color:#fff}
.micb.on{background:var(--red);animation:pulse 1.4s infinite}
.vrow input.txt{padding:0 12px;font-size:15px;height:46px;min-width:0;flex:1}
.vrow .btn{height:46px;padding:0 16px}
.heard1{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px;margin-top:-2px}
@media (max-height:640px){.gs .pl .meta{display:none}.gs .lt{display:none}.kp .mod{padding:6px 0}}
</style>
</head>

<script>
/* =====================================================================
   FIREBASE (gra przez internet). Wklej tu swoją konfigurację z konsoli
   Firebase (Realtime Database) – albo wklej ją w apce: Opcje → Firebase.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAn5kd9zX_vyfykIQUwkrK9DSZ27B5Jbm0",
  authDomain: "darts-50858.firebaseapp.com",
  databaseURL: "https://darts-50858-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "darts-50858",
  storageBucket: "darts-50858.firebasestorage.app",
  messagingSenderId: "892986687140",
  appId: "1:892986687140:web:86b5b994b9961b2b5ab031"
};
/* ===================================================================== */

const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const PCOL=['#f4b942','#3fa7ff','#ff4fa3','#4cd17a'];
const THEMES=[['dark','Ciemny (domyślny)'],['classic','Klasyczna tarcza'],['blue','Ciemny niebieski'],['light','Jasny'],['neon','Neon'],['pub','Pub (drewno i złoto)'],['sukno','Sukno (zielony stół)']];
const S={screen:'home',prev:'home',
  cfg:{mode:'x01',start:501,doubleOut:true,rounds:7,legs:1,sets:1,bull:'match',count:2,names:['','','',''],theme:'dark',voiceMode:'free',speak:true,myName:''},
  game:null,hist:[],session:[],modal:null,statMode:'game',statPlayer:null,lastMsg:'',segInfo:null,
  say:null,match:null,rank:[],online:null,room:null,micOn:false,heard:'',txt:'',err:'',fbText:''};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
{const c=LS.get('darts_cfg');if(c)Object.assign(S.cfg,c)}
{const st=LS.get('darts_state');if(st){S.session=st.session||[];if(st.game){S.saved=st}}}
S.rank=LS.get('darts_rank')||[];
function saveCfg(){LS.set('darts_cfg',S.cfg)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const isSh=g=>g&&g.type==='sh';
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function applyTheme(){document.body.dataset.t=S.cfg.theme;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).getPropertyValue('--bg').trim()}

/* ---------- zapis / synchronizacja ---------- */
let lastSay=null;
function commit(){
  if(S.online){pushRoom()}
  else LS.set('darts_state',{match:S.match,game:S.game&&S.game.winner==null?S.game:null,hist:S.hist.slice(-60),session:S.session.slice(-50),last:S.lastMsg});
  handleSay();
}
function handleSay(){
  const n=S.say?S.say.n:0;
  if(lastSay===null){lastSay=n;return}
  if(n!==lastSay){lastSay=n;if(!S.online||S.say.p===S.online.me||(S.say.p===-1&&S.online.me===0))speak(S.say.txt)}
}
function setSay(p,txt){S.say={n:(S.say?S.say.n:0)+1,p,txt}}

/* ---------- logika gry ---------- */
function newGame(keepPlayers,namesOverride,nextLeg){
  const c=S.cfg;let names,type;
  const prevToWin=S.game&&S.match?S.match.toWin:c.legs,prevSets=S.game&&S.match?(S.match.setsToWin||1):(c.sets||1);

    S.heard=d.length?`✅ Słyszę: „${esc(t)}”<br>→ <b>${d.map(lab2).join(' · ')}</b> = <b>${sum}</b>`:`⚠️ Słyszę: „${esc(t)}” – ale nie rozpoznaję rzutów. Spróbuj np. „triple dwadzieścia, dwadzieścia, zero”.`;
    if(d.length)speak('Razem '+sum)};
  r.onerror=e=>{got=true;S.heard=e.error==='not-allowed'||e.error==='service-not-allowed'?'<b style="color:var(--red)">Brak dostępu do mikrofonu.</b> Stuknij 🔒 obok adresu strony → Uprawnienia → Mikrofon → Zezwól.':e.error==='no-speech'?'⚠️ Nic nie usłyszałem – mów głośniej, bliżej telefonu.':'Błąd mikrofonu: '+e.error};
  r.onend=()=>{S.micTest=false;if(!got)S.heard='⚠️ Nic nie usłyszałem – spróbuj jeszcze raz.';render()};
  try{r.start()}catch(e){S.micTest=false;S.heard='Błąd mikrofonu: '+e.message;render()}
}
let speaking=false,spkTimer=null;
function speak(txt){
  showSaid(txt);

  // mikrofon na czas mówienia wyłączamy – na Androidzie inaczej telefon nie czyta
  speaking=true;mute=true;if(rec&&S.micOn)try{rec.abort()}catch(e){}
  const u=new SpeechSynthesisUtterance(txt);u.lang='pl-PL';u.rate=1.05;
  const v=ss.getVoices().find(v=>/^pl/i.test(v.lang));if(v)u.voice=v;
  let fin=false;const done=()=>{if(fin)return;fin=true;clearTimeout(spkTimer);
    setTimeout(()=>{speaking=false;mute=false;if(rec&&S.micOn)try{rec.start()}catch(e){}},400)};
  u.onend=done;u.onerror=done;spkTimer=setTimeout(done,7000);
  try{ss.cancel();ss.resume();setTimeout(()=>ss.speak(u),150)}catch(e){done()}

/* ---------- podpowiedź zakończenia (501) ---------- */
const ALL=[];for(let n=20;n>=1;n--)ALL.push({k:'T'+n,v:n*3});
ALL.push({k:'50',v:50},{k:'25',v:25});
for(let n=20;n>=1;n--)ALL.push({k:'S'+n,v:n});
for(let n=20;n>=1;n--)ALL.push({k:'D'+n,v:n*2});
const DBL=[...Array(20)].map((_,i)=>({k:'D'+(20-i),v:(20-i)*2})).concat([{k:'50',v:50}]);
const coCache={};
function checkout(r,n,dout){
  const key=r+'_'+n+'_'+dout;if(key in coCache)return coCache[key];
  let res=null;const fin=dout?DBL:ALL;
  if(r>=2||(!dout&&r>=1)){
    for(const f of fin)if(f.v===r){res=[f];break}
    if(!res&&n>=2)o2:for(const a of ALL)for(const f of fin)if(a.v+f.v===r){res=[a,f];break o2}
    if(!res&&n>=3)o3:for(const a of ALL)for(const b of ALL)for(const f of fin)if(a.v+b.v+f.v===r){res=[a,b,f];break o3}
  }
  return coCache[key]=res;
}

function fbConfig(){if(FIREBASE_CONFIG.apiKey)return FIREBASE_CONFIG;const c=LS.get('darts_fb');return c&&c.apiKey?c:null}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Nie udało się wczytać '+src));document.head.append(s)})}
function getDB(){
  if(db)return Promise.resolve(db);
  if(testDB){db=makeFakeDB();return Promise.resolve(db)}
  const cfg=fbConfig();if(!cfg)return Promise.reject(new Error('Brak konfiguracji Firebase'));
  if(!fbLoading)fbLoading=loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js')
    .then(()=>loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'))
    .then(()=>{firebase.initializeApp(cfg);db=firebase.database();return db})
    .catch(e=>{fbLoading=null;throw e});
  return fbLoading;
}
function makeFakeDB(){ // atrapa do testów – dane tylko w tej karcie
  const root={},subs=[];
  const get=p=>p.split('/').reduce((o,k)=>o==null?undefined:o[k],root);
  const put=(p,v)=>{const k=p.split('/'),last=k.pop();let o=root;for(const x of k){if(typeof o[x]!=='object'||o[x]===null)o[x]={};o=o[x]}o[last]=JSON.parse(JSON.stringify(v));subs.forEach(f=>f())};
  return{ref:p=>({key:p.split('/').pop(),set:v=>{put(p,v);return Promise.resolve()},
    once:()=>{const v=get(p);return Promise.resolve({exists:()=>v!=null,val:()=>v})},
    on:(_,cb)=>{const f=()=>{const v=get(p);cb({val:()=>v==null?null:JSON.parse(JSON.stringify(v))})};subs.push(f);f()},off:()=>{}})};
}
function roomPayload(){return{d:JSON.stringify({room:S.room,game:S.game,match:S.match,hist:S.hist.slice(-40),session:S.session.slice(-30),last:S.lastMsg,say:S.say}),t:Date.now()}}

function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>A[Math.random()*A.length|0]).join('')}
async function createRoom(){
  const name=(S.cfg.myName||'').trim()||'Gracz 1';S.err='';
  try{
    const d=await getDB();const code=genCode();
    S.room={phase:'lobby',names:[name],cfg:roomCfg()};
    S.game=null;S.hist=[];S.session=[];S.lastMsg='';S.say=null;
    S.online={code,me:0};roomRef=d.ref('rooms/'+code);await roomRef.set(roomPayload());listen();
  }catch(e){S.err=e.message;render()}
}
async function joinRoom(code){
  code=(code||'').trim().toUpperCase();if(!code){S.err='Wpisz kod pokoju';render();return}
  const name=(S.cfg.myName||'').trim()||'Gracz';S.err='';
  try{
    const d=await getDB();const ref=d.ref('rooms/'+code);const sn=await ref.once('value');
    if(!sn.exists()){S.err='Nie ma takiego pokoju: '+code;render();return}
    const st=JSON.parse(sn.val().d);let me=st.room.names.indexOf(name);
    if(me<0){
      if(st.room.phase!=='lobby'){S.err='Gra w tym pokoju już trwa – dołącz tym samym nickiem, jakim grałeś.';render();return}
      if(st.room.names.length>=4){S.err='Pokój jest pełny (4 graczy).';render();return}
      st.room.names.push(name);me=st.room.names.length-1;await ref.set({d:JSON.stringify(st),t:Date.now()});
    }
    S.online={code,me};roomRef=ref;listen();
  }catch(e){S.err=e.message;render()}

function listen(){
  LS.set('darts_room',{code:S.online.code,me:S.online.me,test:testDB});
  lastSay=null;
  roomRef.on('value',sn=>{
    const v=sn.val();if(!v||!S.online)return;const st=JSON.parse(v.d);
    S.room=st.room;S.game=st.game;S.match=st.match||null;
    if(S.online.me!==0&&S.room.cfg)Object.assign(S.cfg,S.room.cfg);S.hist=st.hist||[];S.session=st.session||[];S.lastMsg=st.last||'';S.say=st.say;
    if(S.room.cfg)Object.assign(S.cfg,{mode:S.room.cfg.mode});

function curType(){return S.game?S.game.type:(S.cfg.mode==='sh'?'sh':'x01')}
function gamesFor(mode){
  if(mode==='game'){if(!S.game)return[];const l=S.session.filter(g=>g.mid&&g.mid===S.game.mid);if(!l.includes(S.game)&&!l.some(g=>g===S.game||JSON.stringify(g)===JSON.stringify(S.game)))l.push(S.game);return l}
  const t=curType();const l=S.session.filter(g=>g.type===t);
  if(S.game&&S.game.winner==null&&S.game.type===t)l.push(S.game);return l;
}
function winsMap(){const w={},t=curType();S.session.forEach(x=>{if(x.type===t&&x.winner!=null&&!x.tie){const n=x.players[x.winner].name;w[n]=(w[n]||0)+1}});return w}
function stats(games,name){
  const s={hits:{},darts:0,scored:0,turns:0,best:0,n180:0,n140:0,n100:0,bust:0,wins:0,coHigh:0,legs:0,sh:0,hit:0};
  for(const g of games)g.players.forEach((p,i)=>{
    if(name&&p.name!==name)return;
    s.legs++;if(g.winner===i&&!g.tie)s.wins++;
    for(const t of p.turns){
      s.turns++;s.darts+=t.darts.length;s.scored+=t.total;if(t.bust)s.bust++;if(t.sh)s.sh++;
      if(t.total>s.best)s.best=t.total;
      if(t.total===180)s.n180++;else if(t.total>=140)s.n140++;else if(t.total>=100)s.n100++;
      if(t.co&&t.total>s.coHigh)s.coHigh=t.total;
      for(const d of t.darts){s.hits[d.k]=(s.hits[d.k]||0)+1;if(d.k!=='M')s.hit++}
    }
  });
  s.avg=s.darts?s.scored/s.darts*3:0;s.hitPct=s.darts?Math.round(s.hit/s.darts*100):0;return s;
}
/* tarcza: każdy gracz ma swój kolor, pole dzielone na paski – po jednym na gracza */
function boardSVG(sets,sel){
  const C=200,N=sets.length;let max=1;
  sets.forEach(s=>Object.entries(s.hits).forEach(([k,v])=>{if(k!=='M'&&v>max)max=v}));
  const al=c=>.22+.78*c/max;
  const P=(r,a)=>{const t=(a-90)*Math.PI/180;return[(C+r*Math.cos(t)).toFixed(2),(C+r*Math.sin(t)).toFixed(2)]};
  const arc=(r1,r2,a1,a2)=>{const lg=a2-a1>180?1:0;const[x1,y1]=P(r2,a1),[x2,y2]=P(r2,a2),[x3,y3]=P(r1,a2),[x4,y4]=P(r1,a1);
    return`M${x1},${y1}A${r2},${r2} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}`+(r1>0?`A${r1},${r1} 0 ${lg} 0 ${x4},${y4}`:'')+'Z'};
  const ring=(r1,r2)=>`M${C-r2},${C}a${r2},${r2} 0 1,0 ${2*r2},0a${r2},${r2} 0 1,0 ${-2*r2},0Z`+(r1>0?`M${C-r1},${C}a${r1},${r1} 0 1,1 ${2*r1},0a${r1},${r1} 0 1,1 ${-2*r1},0Z`:'');
  const T=(x,y,t,fs)=>`<text x="${x}" y="${y}" font-size="${fs}" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" style="paint-order:stroke;pointer-events:none" stroke="#000" stroke-width="2.5">${t}</text>`;
  let base=`<circle cx="${C}" cy="${C}" r="196" fill="#0b0d10"/>`,hot='',txt='',nums='',outl='';
  const seg=k=>`data-act="seg" data-v="${k}"`;
  ORDER.forEach((n,i)=>{
    const a1=i*18-9,dk=i%2===0,w=18/N;
    [['S',16,95],['T',95,105],['S',105,160],['D',160,170]].forEach(([m,r1,r2])=>{
      const k=m+n,ringc=m!=='S';
      const col=ringc?(dk?'#3a2a2d':'#27352c'):(dk?'#22272e':'#2c323a');
      base+=`<path ${seg(k)} d="${arc(r1,r2,a1,a1+18)}" fill="${col}" stroke="#0b0d10" stroke-width="1"/>`;
      sets.forEach((s,j)=>{const c=s.hits[k]||0;if(c)hot+=`<path ${seg(k)} d="${arc(r1,r2,a1+j*w,a1+(j+1)*w)}" fill="${rgba(s.color,al(c))}"/>`});
      if(sel===k)outl+=`<path d="${arc(r1,r2,a1,a1+18)}" fill="none" stroke="#fff" stroke-width="2.5" pointer-events="none"/>`;
    });
    if(N===1){[['S',132,13],['T',100,10],['D',165,10]].forEach(([m,r,fs])=>{const c=sets[0].hits[m+n]||0;if(!c)return;const[x,y]=P(r,a1+9);txt+=T(x,y,c,fs)})}
    else sets.forEach((s,j)=>{const c=s.hits['S'+n]||0;if(!c)return;const[x,y]=P(135,a1+(j+.5)*w);txt+=T(x,y,c,N>2?8:10)});
    const[x,y]=P(184,a1+9);nums+=`<text x="${x}" y="${y}" font-size="15" font-family="Oswald" fill="#cfd6de" text-anchor="middle" dominant-baseline="central" pointer-events="none">${n}</text>`;
  });
  base+=`<path ${seg('25')} d="${ring(7,16)}" fill-rule="evenodd" fill="#27352c" stroke="#0b0d10"/><circle ${seg('50')} cx="${C}" cy="${C}" r="7" fill="#3a2a2d" stroke="#0b0d10"/>`;
  sets.forEach((s,j)=>{
    const c25=s.hits['25']||0,c50=s.hits['50']||0,w=360/N;
    if(c25)hot+=`<path ${seg('25')} fill-rule="evenodd" d="${N===1?ring(7,16):arc(7,16,j*w,(j+1)*w)}" fill="${rgba(s.color,al(c25))}"/>`;
    if(c50)hot+=`<path ${seg('50')} d="${N===1?ring(0,7):arc(0,7,j*w,(j+1)*w)}" fill="${rgba(s.color,al(c50))}"/>`;
  });
  if(N===1){const c25=sets[0].hits['25']||0,c50=sets[0].hits['50']||0;if(c25)txt+=T(C,C-11.5,c25,8);if(c50)txt+=T(C,C,c50,8)}
  if(sel==='25')outl+=`<path d="${ring(7,16)}" fill="none" stroke="#fff" stroke-width="2" pointer-events="none"/>`;
  if(sel==='50')outl+=`<circle cx="${C}" cy="${C}" r="7" fill="none" stroke="#fff" stroke-width="2" pointer-events="none"/>`;
  return`<svg class="board" viewBox="0 0 400 400">${base}${hot}${outl}${txt}${nums}</svg>`;
}

function vGameSh(lock){

  const sel=stats(games,S.statPlayer);
  const tot=sel.darts||1,cnt=(s,p)=>Object.entries(s.hits).filter(([k])=>p(k)).reduce((a,[,v])=>a+v,0);
  const sN=cnt(sel,k=>k[0]==='S'),dN=cnt(sel,k=>k[0]==='D'),tN=cnt(sel,k=>k[0]==='T'),bN=cnt(sel,k=>k==='25'||k==='50'),mN=sel.hits.M||0;
  const pct=x=>Math.round(x/tot*100)+'%';
  h+=`<div class="card"><h3>Podział rzutów ${S.statPlayer?'– '+esc(S.statPlayer):''}</h3><div class="kpis" style="margin-top:10px">
    <div class="kpi"><div class="v">${pct(sN)}</div><div class="l">Single (${sN})</div></div>
    <div class="kpi"><div class="v" style="color:var(--grn)">${pct(dN)}</div><div class="l">Double (${dN})</div></div>
    <div class="kpi"><div class="v" style="color:var(--red)">${pct(tN)}</div><div class="l">Triple (${tN})</div></div>
    ${sh?'':`<div class="kpi"><div class="v">${pct(bN)}</div><div class="l">25 / Bull (${bN})</div></div>`}
    <div class="kpi"><div class="v">${pct(mN)}</div><div class="l">Pudła (${mN})</div></div>
    <div class="kpi"><div class="v" style="color:var(--gold)">${sh?sel.hitPct+'%':sel.avg.toFixed(1)}</div><div class="l">${sh?'Skuteczność':'Średnia / 3 lotki'}</div></div></div></div>`;
  const tk={};shown.forEach(x=>Object.entries(x.s.hits).forEach(([k,v])=>{if(k!=='M')tk[k]=(tk[k]||0)+v}));
  const top=Object.entries(tk).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(top.length){const mx=top[0][1];
    h+=`<div class="card"><h3>Najczęstsze pola</h3><div class="bars">${top.map(([k,v])=>`<div class="b"><span class="lab">${lab(k)}</span><div class="stack" style="width:${Math.max(6,v/mx*100)}%">${shown.map(x=>{const c=x.s.hits[k]||0;return c?`<div style="flex:${c};background:${col(x.n)}"></div>`:''}).join('')}</div><span>${v}</span></div>`).join('')}</div></div>`;
    if(!sh){const byNum={};Object.entries(sel.hits).forEach(([k,v])=>{if(k==='M')return;const n=(k==='25'||k==='50')?'Bull':k.replace(/^[SDT]/,'');byNum[n]=(byNum[n]||0)+v});
      const fav=Object.entries(byNum).sort((a,b)=>b[1]-a[1])[0];
      if(fav)h+=`<div class="card mut" style="text-align:center">Ulubiony sektor${S.statPlayer?'':' (wszyscy)'}: <b style="color:var(--gold);font-size:18px">${fav[0]}</b> (${fav[1]} lotek, ${pct(fav[1])})</div>`}
  }
  const rows=sh?[['Triple',k=>k[0]==='T'],['Double',k=>k[0]==='D'],['Zwykłe (single)',k=>k[0]==='S'],['Pudła',k=>k==='M']]
    :[['T20',k=>k==='T20'],['T19',k=>k==='T19'],['T18',k=>k==='T18'],['Wszystkie triple',k=>k[0]==='T'],['Double',k=>k[0]==='D'],['Zwykłe (single)',k=>k[0]==='S'],['25 / Bull',k=>k==='25'||k==='50'],['Pudła',k=>k==='M']];
  h+=`<div class="card"><h3>Podsumowanie ${per.length>1?'– porównanie':''}</h3><div class="tw"><table><tr><th></th>${per.map(({n})=>`<th style="color:${col(n)}">${esc(n)}</th>`).join('')}</tr>`+
    rows.map(([l,f])=>{const vals=per.map(({s})=>cnt(s,f));const mx=Math.max(...vals);const good=l!=='Pudła';
      return`<tr><td>${l}</td>${vals.map(v=>`<td style="font-family:Oswald;font-size:17px;${per.length>1&&v===mx&&v>0?`color:${good?'var(--gold)':'var(--red)'}`:''}">${v}</td>`).join('')}</tr>`}).join('')+`</table></div></div>`;
  if(!sh)h+=vRank(true);
  if(S.game&&S.game.winner!=null&&S.match&&!S.match.over)h+=`<button class="btn pri" data-act="nextleg">▶ NASTĘPNY LEG</button>`;
  else if(S.game&&S.game.winner!=null)h+=`<button class="btn pri" data-act="rematch">🔁 REWANŻ</button>`+(S.online?'':`<button class="btn full" data-act="setup">Menu – inna gra / gracze</button>`);
  if(!S.online&&S.statMode==='session'&&S.session.length)h+=`<button class="btn full" data-act="clearsess">🗑 Wyczyść zapisane statystyki</button>`;
  return h;
}
const TUT=[
 ['🎯','Witaj w Darts!','Na starcie wybierasz <b>grę</b> (501, 301, 701, Szanghaj), <b>sety i legi</b> oraz czy zaczynacie od <b>rzutu na bulla</b> (kto bliżej, ten zaczyna), a potem jak gracie: <b>🌐 online</b> – każdy na swoim telefonie, albo <b>📱 na jednym telefonie</b>. Na dole masz Statystyki, Ranking i Opcje.'],
 ['👆','Wpisywanie przyciskami','Najpierw <b>SINGLE / DOUBLE / TRIPLE</b>, potem liczba. Np. TRIPLE → 20 = <b>T20</b>. Po każdej lotce wraca na SINGLE. Jest też 25, BULL i PUDŁO.'],
 ['🎤','Mówienie rzutów','Dotknij <b>🎤</b> (na dole, obok pola do wpisywania) i powiedz trzy rzuty, np. <i>„triple dwadzieścia, dwadzieścia, zero”</i>. Apka przeczyta <b>„Razem 80. Teraz Marek”</b> i sama przejdzie do następnego gracza – on od razu mówi swoje.'],
 ['↶','Pomyłka? Powiedz „cofnij”','Powiedz <b>„cofnij”</b> (albo „popraw”) – cała ostatnia tura wraca i podajesz ją jeszcze raz. Przycisk <b>↶ COFNIJ</b> cofa jedną lotkę. „<b>Dalej</b>” = reszta lotek to pudła.'],
 ['📊','Statystyki','Pod 📊 zobaczysz tarczę z trafieniami – każdy gracz swoim kolorem – oraz porównanie: ile T20, T19, zwykłych, średnie, 180-tki. Jest też <b>ranking Top 5</b> najlepszych średnich. Przed grą ustawisz <b>sety i legi</b> – także w grze przez internet (gospodarz w pokoju). Wygląd i głos zmienisz w ⚙ Opcjach.']];
function vTut(){
  const i=S.tut,t=TUT[i],last=i===TUT.length-1;
  return`<div class="modal" style="z-index:30"><div class="box"><div style="font-size:52px">${t[0]}</div><h2 style="margin:8px 0">${t[1]}</h2>
  <div class="note" style="font-size:15px;color:var(--txt);text-align:left">${t[2]}</div>
  <div style="margin:14px 0 4px">${TUT.map((_,j)=>`<span class="dot" style="background:${j===i?'var(--gold)':'var(--line)'};margin:0 3px"></span>`).join('')}</div>
  <button class="btn pri" style="margin-top:10px" data-act="tutnext">${last?'GRAMY! 🎯':'DALEJ →'}</button>
  ${last?'':'<button class="btn" data-act="tutskip">Pomiń samouczek</button>'}</div></div>`;
}
function render(){
  const a=$('app'),f=document.activeElement,fid=f&&f.id,pos=f&&f.selectionStart;
  if(S.screen==='setup')S.screen='home';
  const sc=S.screen;
  const html=sc==='game'&&S.game?vGame():sc==='stats'?vStats():sc==='opts'?vOpts():sc==='online'?vOnline():sc==='lobby'&&S.room?vLobby():sc==='local'?vLocal():sc==='rank'?vRankScreen():vHome();
  const nav=(sc==='home'||sc==='rank'||(sc==='stats'&&!S.game)||(sc==='opts'&&S.prev!=='game'&&S.prev!=='lobby'))&&!S.online;
  document.body.classList.toggle('hasnav',nav);document.body.classList.toggle('ingame',sc==='game'&&!!S.game);
  const anim=S._ls!==sc;S._ls=sc;
  a.innerHTML=`<div class="screen${anim?' anim':''}">${html}</div>`+(nav?vNav():'');
  if(anim)window.scrollTo(0,0);
  if(S.tut!=null)a.innerHTML+=vTut();
  if(fid&&$(fid)){const e=$(fid);e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}
}

/* ---------- zdarzenia ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('nick')&&t.dataset.i!=null){S.cfg.names[+t.dataset.i]=t.value;saveCfg();return}
  const k=t.dataset.act2;if(!k)return;
  if(k==='txt')S.txt=t.value;else if(k==='fbText')S.fbText=t.value;
  else if(k==='myName'){S.cfg.myName=t.value;saveCfg()}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.act2;if(k==='theme'){S.cfg.theme=e.target.value;saveCfg();applyTheme();render()}
  else if(k==='voiceMode'){S.cfg.voiceMode=e.target.value;saveCfg()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='txt'){e.preventDefault();doTxt()}if(e.key==='Enter'&&e.target.id==='joincode'){e.preventDefault();joinRoom(e.target.value)}});
function doTxt(){const v=S.txt.trim();if(!v)return;S.txt='';handleText(v,true)}
window.addEventListener('error',e=>{S.heard='⚠️ Błąd apki: '+esc(e.message)+' – zrób zrzut ekranu i wyślij Claude.';try{render()}catch(x){}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,v=b.dataset.v,g=S.game;
  switch(act){
    case'mode':S.cfg.mode=v;saveCfg();syncLobby();break;
    case'count':S.cfg.count=+v;saveCfg();break;
    case'start':S.cfg.start=+v;saveCfg();syncLobby();break;
    case'rounds':S.cfg.rounds=+v;saveCfg();syncLobby();break;
    case'legs':S.cfg.legs=+v;saveCfg();syncLobby();break;
    case'bullmode':S.cfg.bull=v;saveCfg();syncLobby();break;
    case'bullpick':chooseBull(+v);return;
    case'bullrand':chooseBull(Math.floor(Math.random()*S.game.players.length));return;
    case'sets':S.cfg.sets=+v;saveCfg();syncLobby();break;
    case'nextleg':newGame(true,null,true);break;
    case'clearrank':S.rank=[];LS.set('darts_rank',[]);break;
    case'dout':S.cfg.doubleOut=!S.cfg.doubleOut;saveCfg();syncLobby();break;
    case'speakT':S.cfg.speak=!S.cfg.speak;saveCfg();break;
    case'go':newGame(false);break;
    case'resume':{const st=S.saved;S.match=st.match||{id:'x'+Date.now(),toWin:1,wins:{},over:false,leg:1};S.game=st.game;S.hist=st.hist||[];S.lastMsg=st.last||'';S.saved=null;S.screen='game';break}
    case'mod':if(canThrow())g.mod=g.mod===+v?1:+v;break;
    case'n':throwDart(+v,+v===0?1:g.mod);return;
    case'bull':throwDart(25,2);return;
    case'sh':throwSh(+v);return;
    case'undo':undo();return;
    case'skip':skip();return;
    case'mic':micToggle();return;
    case'txtok':doTxt();return;
    case'menu':S.modal='menu';break;
    case'close':S.modal=null;break;
    case'rematch':if(S.online)S.room.phase='game';newGame(true);break;
    case'setup':S.modal=null;S.screen='home';if(S.game&&S.game.winner==null){S.saved={game:S.game,hist:S.hist,last:S.lastMsg}}if(S.game)S.cfg.mode=S.game.type;S.game=null;break;
    case'stats':S.modal=null;S.screen='stats';S.statMode=S.game?'game':'session';S.segInfo=null;break;
    case'back':if(S.game){S.screen='game';if(S.game.winner!=null)S.modal=S.match&&!S.match.over?'leg':'win'}else S.screen=S.online?'lobby':'home';break;
    case'smode':S.statMode=v;S.segInfo=null;break;
    case'sp':S.statPlayer=v||null;break;
    case'seg':S.segInfo=S.segInfo===v?null:v;break;
    case'clearsess':S.session=[];commit();break;
    case'opts':S.prev=S.screen==='opts'?S.prev:S.screen;S.modal=null;S.err='';S.screen='opts';break;
    case'optsback':S.screen=S.prev||'home';S.err='';break;
    case'tutnext':if(S.tut<TUT.length-1){S.tut++;break}
    case'tutskip':S.tut=null;LS.set('darts_tut',1);break;
    case'tut':S.tut=0;break;
    case'mictest':micTest();return;
    case'vtest':{const ss=window.speechSynthesis;if(!ss){S.heard='Ta przeglądarka nie umie czytać głosem';break}
      const all=ss.getVoices();const pl=all.filter(v=>/^pl/i.test(v.lang)).length;S.heard='Głosy: '+all.length+', polskie: '+pl+(pl?'':'<br><b style="color:var(--red)">Brak polskiego głosu – telefon nie przeczyta wyniku.</b> Ustawienia → Zarządzanie ogólne → Język → Zamiana tekstu na mowę → Preferowany mechanizm: <b>Usługi mowy Google</b> → ⚙ → Zainstaluj dane głosowe → <b>Polski</b>. Potem zamknij i otwórz Chrome.');const sp=S.cfg.speak;S.cfg.speak=true;speak('Razem sto osiemdziesiąt');S.cfg.speak=sp;break}
    case'fbsave':{const c=parseFbConfig(S.fbText);if(!c){S.err='Nie widzę apiKey i databaseURL – wklej cały fragment firebaseConfig (z databaseURL).';break}LS.set('darts_fb',c);S.err='';S.fbText='';db=null;fbLoading=null;break}
    case'fbclear':LS.del('darts_fb');db=null;break;
    case'online':S.err='';S.screen='online';break;
    case'home':S.err='';S.screen='home';break;
    case'local':S.err='';S.screen='local';break;
    case'nav':S.modal=null;S.err='';if(v==='opts'){S.prev='home'}if(v==='stats'){S.statMode='session';S.segInfo=null}S.screen=v;break;
    case'gtype':if(v==='sh')S.cfg.mode='sh';else{S.cfg.mode='x01';S.cfg.start=+v}saveCfg();syncLobby();break;
    case'install':if(S.inst){S.inst.prompt();S.inst.userChoice.finally(()=>{S.inst=null;render()})}return;
    case'testdb':testDB=true;db=null;break;
    case'create':createRoom();return;
    case'join':joinRoom(($('joincode')||{}).value);return;
    case'ostart':startOnline();break;
    case'tolobby':S.room.phase='lobby';S.game=null;S.modal=null;S.screen='lobby';pushRoom();break;
    case'leave':leaveRoom();return;
  }
  render();
});
applyTheme();
if(!LS.get('darts_tut'))S.tut=0;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;render()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
{const r=LS.get('darts_room');if(r&&!r.test&&fbConfig()){S.online={code:r.code,me:r.me};S.screen='lobby';getDB().then(d=>{roomRef=d.ref('rooms/'+r.code);listen()}).catch(()=>leaveRoom())}}
render();
</script>
</body>
